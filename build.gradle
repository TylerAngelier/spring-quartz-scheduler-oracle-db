plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.trangelier'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '21'
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring
	implementation 'org.springframework.boot:spring-boot-starter-quartz'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'

	// Persistence: direct oracle ucp starter 26.2.0 (aligns ojdbc17/ucp, auto-config for type + oracleucp.* props)
	implementation 'com.oracle.database.spring:oracle-spring-boot-starter-ucp:26.2.0'
	// Pin Quartz to 2.3.2 (exact pre-SB4 version) to preserve PoC insert behavior for IS_DURABLE etc (avoids 2.5 delta on OracleDelegate/column); SB4 manages ~2.5 but compat per design
	implementation 'org.quartz-scheduler:quartz:2.3.2'

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:oracle-free'  // version managed by Spring Boot BOM via spring-boot-testcontainers
	testImplementation 'org.awaitility:awaitility'       // version managed (or pin only if you need a specific one for the TC test timing)
}

tasks.named('bootBuildImage') {
	builder = 'paketobuildpacks/builder-jammy-base:latest'
}

tasks.named('test') {
	useJUnitPlatform()
}
